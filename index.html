<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Noventeros FC Gamers</title>
<meta name="description" content="Torneos online de FC26 entre amigos: inscripción, sorteos, fase de grupos, playoffs y tabla de goleo.">

<!-- Iconos. Ojo con los dos nombres: el manifest instala la app como
     "FC Gamers90" (lo que se lee bajo el icono en la pantalla de inicio),
     mientras que NOVENTEROS FC GAMERS es el wordmark de la marca y es lo que se ve
     dentro de la app y al compartir el link. Ver MARCA.md.
     Todos estos archivos los genera tools/iconos.sh; no editarlos a mano. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#070907">

<!-- Vista previa al compartir el link (WhatsApp, Telegram, redes).
     Las URLs deben ser absolutas: con rutas relativas no se muestra nada. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Noventeros FC Gamers">
<meta property="og:title" content="Noventeros FC Gamers">
<meta property="og:description" content="Torneos online de FC26 entre amigos: inscripción, sorteos, fase de grupos, playoffs y tabla de goleo.">
<meta property="og:url" content="https://soyhares.github.io/copa-noventeros-fc-gamers/">
<meta property="og:image" content="https://soyhares.github.io/copa-noventeros-fc-gamers/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Noventeros FC Gamers">
<meta name="twitter:description" content="Torneos online de FC26 entre amigos: inscripción, sorteos, fase de grupos, playoffs y tabla de goleo.">
<meta name="twitter:image" content="https://soyhares.github.io/copa-noventeros-fc-gamers/assets/og.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..0" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="app">
  <div class="topbar">
    <div class="brand-wrap">
      <img class="brand-logo" src="assets/logo.png" alt="">
      <div class="brand"><b class="n1">NOVENTEROS <span class="ver">v1.3.0</span></b><span class="n4">FC GAMERS</span></div>
    </div>
    <div class="pill" id="status-pill">—</div>
  </div>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-view="home"><span class="ic"><span class="material-symbols-outlined">stadium</span></span><span>Inicio</span></button>
    <button data-view="register"><span class="ic"><span class="material-symbols-outlined">how_to_reg</span></span><span>Inscribirme</span></button>
    <button data-view="tournament"><span class="ic"><span class="material-symbols-outlined">trophy</span></span><span>Torneo</span></button>
    <button data-view="admin"><span class="ic"><span class="material-symbols-outlined">lock</span></span><span>Admin</span></button>
  </nav>
</div>
<script type="module" src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
