<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Copas Noventeros FC Gamers</title>
<meta name="description" content="Torneos online de FC26 entre amigos: inscripción, sorteos, fase de grupos, playoffs y tabla de goleo.">

<!-- Icono del tab y de la pantalla de inicio -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<meta name="theme-color" content="#090d09">

<!-- Vista previa al compartir el link (WhatsApp, Telegram, redes).
     Las URLs deben ser absolutas: con rutas relativas no se muestra nada. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Copas Noventeros FC Gamers">
<meta property="og:title" content="Copas Noventeros FC Gamers">
<meta property="og:description" content="Torneos online de FC26 entre amigos: inscripción, sorteos, fase de grupos, playoffs y tabla de goleo.">
<meta property="og:url" content="https://soyhares.github.io/copa-noventeros-fc-gamers/">
<meta property="og:image" content="https://soyhares.github.io/copa-noventeros-fc-gamers/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Copas Noventeros FC Gamers">
<meta name="twitter:description" content="Torneos online de FC26 entre amigos: inscripción, sorteos, fase de grupos, playoffs y tabla de goleo.">
<meta name="twitter:image" content="https://soyhares.github.io/copa-noventeros-fc-gamers/assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Semi+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..0" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="app">
  <div class="topbar">
    <div class="brand-wrap">
      <img class="brand-logo" src="assets/logo.png" alt="">
      <div class="brand"><b>COPAS NOVENTEROS</b><span id="tname-badge">FC Gamers</span></div>
    </div>
    <div class="pill" id="status-pill">—</div>
  </div>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-view="home"><span class="ic"><span class="material-symbols-outlined">stadium</span></span><span>Inicio</span></button>
    <button data-view="register"><span class="ic"><span class="material-symbols-outlined">how_to_reg</span></span><span>Inscribirme</span></button>
    <button data-view="tournament"><span class="ic"><span class="material-symbols-outlined">trophy</span></span><span>Torneo</span></button>
    <button data-view="admin"><span class="ic"><span class="material-symbols-outlined">lock</span></span><span>Admin</span></button>
  </nav>
</div>
<script type="module" src="app.js"></script>
<script>
  // Permite instalar la web como app y abrirla sin conexión (el cascarón; los datos
  // del torneo siguen necesitando internet).
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
