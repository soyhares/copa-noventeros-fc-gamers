# La web se publica SOLO al publicar un release (o a mano desde la pestaña Actions).
# Así main puede avanzar con PRs sin que el sitio cambie hasta que tú decidas.
name: Publicar

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Reunir solo los archivos de la web
        run: |
          mkdir _sitio
          cp -r index.html style.css app.js firebase-config.js manifest.webmanifest sw.js assets _sitio/
          # assets/brand/ son las fuentes de marca en alta (~4.5 MB) que usa
          # tools/iconos.sh. La web no las pide nunca: fuera del sitio publicado.
          rm -rf _sitio/assets/brand

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
